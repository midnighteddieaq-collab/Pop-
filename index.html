<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KenyaTok – Warm Kenyan Vibes</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --kenya-red: #BB0000;
      --kenya-green: #006600;
      --kenya-black: #000000;
      --warm-bg: #1a120b;
      --warm-card: #2a1f15;
      --warm-accent: #e67e22;
      --warm-text: #f5e6d3;
      --soft-orange: #f39c12;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--warm-bg);
      color: var(--warm-text);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: linear-gradient(180deg, #2a1f15 0%, #1a120b 100%);
      border-right: 1px solid rgba(230, 126, 34, 0.2);
      display: flex;
      flex-direction: column;
      padding: 20px 12px;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      padding: 0 8px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--kenya-red), var(--soft-orange));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: white;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--kenya-red), var(--soft-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      color: #d4c4b0;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(230, 126, 34, 0.15);
      color: var(--soft-orange);
    }

    .nav-item.active {
      border-left: 3px solid var(--kenya-red);
    }

    .nav-icon {
      font-size: 22px;
      width: 28px;
      text-align: center;
    }

    /* Main Feed */
    .main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .video-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    .video-container::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      height: 100vh;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      background: #111;
    }

    .video-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.85);
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 40%, transparent 70%, rgba(0,0,0,0.3) 100%);
    }

    /* Right side actions */
    .actions {
      position: absolute;
      right: 16px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      z-index: 10;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .action-btn:active {
      transform: scale(0.9);
    }

    .action-icon {
      width: 52px;
      height: 52px;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .action-count {
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .like-btn.liked .action-icon {
      background: var(--kenya-red);
      animation: heartBeat 0.4s;
    }

    @keyframes heartBeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* Bottom info */
    .video-info {
      position: absolute;
      left: 16px;
      bottom: 100px;
      right: 90px;
      z-index: 10;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--soft-orange);
      object-fit: cover;
    }

    .username {
      font-weight: 600;
      font-size: 17px;
    }

    .follow-btn {
      background: var(--kenya-red);
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .follow-btn:hover {
      background: #990000;
    }

    .follow-btn.following {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.4);
    }

    .caption {
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    .music {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      opacity: 0.9;
    }

    .music-icon {
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Bottom navigation (mobile style) */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 240px;
      right: 0;
      height: 70px;
      background: rgba(26, 18, 11, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(230, 126, 34, 0.2);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }

    .bottom-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #a89078;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .bottom-item.active {
      color: var(--soft-orange);
    }

    .bottom-item .icon {
      font-size: 24px;
    }

    .create-btn {
      width: 52px;
      height: 36px;
      background: linear-gradient(90deg, var(--kenya-red), var(--kenya-green));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      margin-top: -8px;
      box-shadow: 0 4px 15px rgba(187, 0, 0, 0.4);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      .bottom-nav {
        left: 0;
      }
    }

    /* Progress bar at top of each video */
    .progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      background: var(--soft-orange);
      width: 0%;
      z-index: 20;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">KT</div>
      <div class="logo-text">KenyaTok</div>
    </div>

    <div class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>For You</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🔥</span>
      <span>Trending</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🎵</span>
      <span>Music</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">👥</span>
      <span>Following</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">📍</span>
      <span>Near Me</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">💬</span>
      <span>Inbox</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <div class="video-container" id="feed">
      <!-- Videos will be injected here -->
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <div class="bottom-item active">
        <span class="icon">🏠</span>
        <span>Home</span>
      </div>
      <div class="bottom-item">
        <span class="icon">🔍</span>
        <span>Discover</span>
      </div>
      <div class="bottom-item">
        <div class="create-btn">+</div>
      </div>
      <div class="bottom-item">
        <span class="icon">💬</span>
        <span>Inbox</span>
      </div>
      <div class="bottom-item">
        <span class="icon">👤</span>
        <span>Me</span>
      </div>
    </nav>
  </main>

  <script>
    // Sample Kenyan-themed videos (using gradient backgrounds + emoji for demo)
    const videos = [
      {
        id: 1,
        user: "@nairobi_vibes",
        avatar: "https://i.pravatar.cc/150?img=11",
        caption: "Sunday vibes in Nairobi 🌅 Karibu Kenya! Who else loves this weather? #Nairobi #KenyaTok",
        music: "Benga Beats – Original Sound",
        likes: "24.5K",
        comments: "1.2K",
        shares: "890",
        bg: "linear-gradient(135deg, #c0392b, #e67e22, #f1c40f)"
      },
      {
        id: 2,
        user: "@mombasa_queen",
        avatar: "https://i.pravatar.cc/150?img=5",
        caption: "Swahili coast magic 🌴🌊 Fresh coconut water hits different! #Mombasa #CoastLife",
        music: "Taarab Vibes – Coast Sounds",
        likes: "18.9K",
        comments: "943",
        shares: "612",
        bg: "linear-gradient(135deg, #16a085, #27ae60, #2ecc71)"
      },
      {
        id: 3,
        user: "@maasai_warrior",
        avatar: "https://i.pravatar.cc/150?img=33",
        caption: "Traditional Maasai dance in full color ❤️🖤💚 Preserving our culture with pride! #Maasai #Kenya",
        music: "Maasai Drums – Ancestral Beat",
        likes: "42.1K",
        comments: "3.4K",
        shares: "2.1K",
        bg: "linear-gradient(135deg, #8e44ad, #c0392b, #e74c3c)"
      },
      {
        id: 4,
        user: "@safari_king",
        avatar: "https://i.pravatar.cc/150?img=68",
        caption: "Sunrise over the Maasai Mara 🦁 Nothing compares to Kenya’s wild beauty #Safari #BigFive",
        music: "Wildlife Ambience – Nature Sounds",
        likes: "67.3K",
        comments: "4.8K",
        shares: "5.2K",
        bg: "linear-gradient(135deg, #d35400, #e67e22, #f39c12)"
      },
      {
        id: 5,
        user: "@nairobi_chef",
        avatar: "https://i.pravatar.cc/150?img=20",
        caption: "Making the perfect chapati + nyama choma combo 🔥 Who wants the recipe? #KenyanFood #Chapati",
        music: "Kitchen Beats – Cooking Vibes",
        likes: "31.7K",
        comments: "2.9K",
        shares: "1.8K",
        bg: "linear-gradient(135deg, #c0392b, #e74c3c, #e67e22)"
      }
    ];

    const feed = document.getElementById('feed');

    // Render videos
    videos.forEach((video, index) => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <div class="progress" id="progress-${video.id}"></div>
        <div class="video-bg" style="background: ${video.bg}"></div>
        <div class="video-overlay"></div>

        <div class="actions">
          <div class="action-btn like-btn" onclick="toggleLike(this)">
            <div class="action-icon">❤️</div>
            <span class="action-count">${video.likes}</span>
          </div>
          <div class="action-btn">
            <div class="action-icon">💬</div>
            <span class="action-count">${video.comments}</span>
          </div>
          <div class="action-btn">
            <div class="action-icon">↪️</div>
            <span class="action-count">${video.shares}</span>
          </div>
          <div class="action-btn">
            <div class="action-icon">📌</div>
            <span class="action-count">Save</span>
          </div>
        </div>

        <div class="video-info">
          <div class="user-row">
            <img src="\( {video.avatar}" class="avatar" alt=" \){video.user}">
            <span class="username">${video.user}</span>
            <button class="follow-btn" onclick="toggleFollow(this)">Follow</button>
          </div>
          <p class="caption">${video.caption}</p>
          <div class="music">
            <span class="music-icon">🎵</span>
            <span>${video.music}</span>
          </div>
        </div>
      `;
      feed.appendChild(card);
    });

    // Like toggle
    function toggleLike(btn) {
      btn.classList.toggle('liked');
      const count = btn.querySelector('.action-count');
      if (btn.classList.contains('liked')) {
        // simple visual feedback
        count.style.color = '#ff4757';
      } else {
        count.style.color = '';
      }
    }

    // Follow toggle
    function toggleFollow(btn) {
      if (btn.classList.contains('following')) {
        btn.classList.remove('following');
        btn.textContent = 'Follow';
      } else {
        btn.classList.add('following');
        btn.textContent = 'Following';
      }
    }

    // Simple progress bar animation for the current video
    let currentIndex = 0;
    const cards = document.querySelectorAll('.video-card');

    function updateProgress() {
      cards.forEach((card, i) => {
        const progress = card.querySelector('.progress');
        if (i === currentIndex) {
          progress.style.width = '100%';
          progress.style.transition = 'width 8s linear';
        } else {
          progress.style.width = '0%';
          progress.style.transition = 'none';
        }
      });
    }

    // Detect which video is in view
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          currentIndex = Array.from(cards).indexOf(entry.target);
          updateProgress();
        }
      });
    }, { threshold: 0.6 });

    cards.forEach(card => observer.observe(card));

    // Start first progress
    updateProgress();
  </script>
</body>
</html>
