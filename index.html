<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KenyaTok – Full Experience</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --kenya-red: #BB0000;
      --kenya-green: #006600;
      --warm-bg: #1a120b;
      --warm-card: #2a1f15;
      --soft-orange: #e67e22;
      --warm-text: #f5e6d3;
      --muted: #a89078;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: var(--warm-bg); color: var(--warm-text); height: 100vh; overflow: hidden; }

    /* ========== LAYOUT ========== */
    .app { display: flex; height: 100vh; }

    .sidebar {
      width: 240px; background: linear-gradient(180deg, #2a1f15, #1a120b);
      border-right: 1px solid rgba(230,126,34,0.2); padding: 20px 12px;
      display: flex; flex-direction: column; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; padding: 0 8px; }
    .logo-icon {
      width: 42px; height: 42px; background: linear-gradient(135deg, var(--kenya-red), var(--soft-orange));
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: white;
    }
    .logo-text { font-size: 22px; font-weight: 700; background: linear-gradient(90deg, var(--kenya-red), var(--soft-orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .nav-item {
      display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 12px;
      margin-bottom: 4px; cursor: pointer; color: var(--muted); font-weight: 500; transition: 0.2s;
    }
    .nav-item:hover, .nav-item.active { background: rgba(230,126,34,0.15); color: var(--soft-orange); }
    .nav-item.active { border-left: 3px solid var(--kenya-red); }

    .main { flex: 1; position: relative; overflow: hidden; }

    /* ========== PAGES ========== */
    .page { display: none; height: 100%; }
    .page.active { display: block; }

    /* ========== FEED ========== */
    .video-container {
      height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
    }
    .video-container::-webkit-scrollbar { display: none; }

    .video-card {
      height: 100vh; scroll-snap-align: start; position: relative; background: #000;
    }
    .video-card video {
      width: 100%; height: 100%; object-fit: cover;
    }
    .video-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
    }

    .actions {
      position: absolute; right: 14px; bottom: 130px; display: flex; flex-direction: column;
      align-items: center; gap: 20px; z-index: 20;
    }
    .action-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
    }
    .action-icon {
      width: 50px; height: 50px; background: rgba(0,0,0,0.45); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
      backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.12);
      transition: 0.15s;
    }
    .action-btn:active .action-icon { transform: scale(0.9); }
    .action-count { font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px black; }
    .liked .action-icon { background: var(--kenya-red); animation: heart 0.35s; }
    @keyframes heart { 50% { transform: scale(1.25); } }

    .video-info {
      position: absolute; left: 14px; bottom: 110px; right: 85px; z-index: 20;
    }
    .user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .avatar {
      width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--soft-orange); object-fit: cover;
    }
    .username { font-weight: 600; font-size: 16px; }
    .follow-btn {
      background: var(--kenya-red); color: white; border: none; padding: 5px 14px;
      border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .follow-btn.following { background: transparent; border: 1px solid rgba(255,255,255,0.4); }
    .caption { font-size: 14.5px; line-height: 1.4; margin-bottom: 6px; text-shadow: 0 1px 3px black; }
    .music { display: flex; align-items: center; gap: 7px; font-size: 13px; opacity: 0.9; }
    .music-icon { animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== BOTTOM NAV ========== */
    .bottom-nav {
      position: absolute; bottom: 0; left: 240px; right: 0; height: 68px;
      background: rgba(26,18,11,0.95); backdrop-filter: blur(12px);
      border-top: 1px solid rgba(230,126,34,0.2);
      display: flex; justify-content: space-around; align-items: center; z-index: 50;
    }
    .bottom-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: var(--muted); font-size: 11px; cursor: pointer;
    }
    .bottom-item.active { color: var(--soft-orange); }
    .bottom-item .icon { font-size: 23px; }
    .create-btn {
      width: 50px; height: 34px; background: linear-gradient(90deg, var(--kenya-red), var(--kenya-green));
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      font-size: 26px; color: white; margin-top: -6px; box-shadow: 0 4px 12px rgba(187,0,0,0.4);
    }

    /* ========== COMMENTS MODAL ========== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .comments-modal {
      width: 100%; max-width: 500px; height: 65vh; background: var(--warm-card);
      border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-between; align-items: center; font-weight: 600;
    }
    .close-btn { background: none; border: none; color: var(--warm-text); font-size: 22px; cursor: pointer; }
    .comments-list { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .comment {
      display: flex; gap: 10px; margin-bottom: 16px;
    }
    .comment img { width: 36px; height: 36px; border-radius: 50%; }
    .comment-body { flex: 1; }
    .comment-user { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .comment-text { font-size: 14px; color: #e8d9c5; }
    .comment-time { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .comment-input-area {
      padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; gap: 10px; align-items: center;
    }
    .comment-input {
      flex: 1; background: #1a120b; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 10px 16px; color: white; outline: none;
    }
    .post-comment-btn {
      background: var(--kenya-red); color: white; border: none; padding: 10px 18px;
      border-radius: 20px; font-weight: 600; cursor: pointer;
    }

    /* ========== OTHER PAGES ========== */
    .page-content {
      height: calc(100vh - 68px); overflow-y: auto; padding: 20px;
    }
    .page-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; }

    /* Discover */
    .search-bar {
      background: #2a1f15; border-radius: 12px; padding: 12px 16px; display: flex;
      align-items: center; gap: 10px; margin-bottom: 24px; border: 1px solid rgba(230,126,34,0.2);
    }
    .search-bar input {
      flex: 1; background: none; border: none; color: white; outline: none; font-size: 15px;
    }
    .trending-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px;
    }
    .trend-card {
      background: #2a1f15; border-radius: 12px; overflow: hidden; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .trend-card img { width: 100%; height: 180px; object-fit: cover; }
    .trend-info { padding: 10px; }
    .trend-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .trend-views { font-size: 12px; color: var(--muted); }

    /* Create */
    .upload-area {
      border: 2px dashed rgba(230,126,34,0.4); border-radius: 16px; padding: 60px 20px;
      text-align: center; margin-bottom: 24px; cursor: pointer; transition: 0.2s;
    }
    .upload-area:hover { border-color: var(--soft-orange); background: rgba(230,126,34,0.05); }
    .upload-icon { font-size: 48px; margin-bottom: 12px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
    .form-group input, .form-group textarea {
      width: 100%; background: #2a1f15; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 12px; color: white; outline: none;
    }
    .form-group textarea { height: 100px; resize: none; }
    .publish-btn {
      width: 100%; background: linear-gradient(90deg, var(--kenya-red), var(--soft-orange));
      color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px;
      font-weight: 600; cursor: pointer; margin-top: 10px;
    }

    /* Profile */
    .profile-header { text-align: center; margin-bottom: 30px; }
    .profile-avatar {
      width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--soft-orange);
      object-fit: cover; margin-bottom: 12px;
    }
    .profile-name { font-size: 22px; font-weight: 700; }
    .profile-bio { color: var(--muted); margin: 8px 0 16px; font-size: 14px; }
    .profile-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
    .stat { text-align: center; }
    .stat-num { font-size: 18px; font-weight: 700; }
    .stat-label { font-size: 12px; color: var(--muted); }
    .edit-profile-btn {
      background: #2a1f15; border: 1px solid rgba(255,255,255,0.15); color: white;
      padding: 8px 24px; border-radius: 8px; font-weight: 500; cursor: pointer;
    }
    .profile-videos {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 20px;
    }
    .profile-video {
      aspect-ratio: 9/16; background: #333; position: relative; overflow: hidden;
    }
    .profile-video video, .profile-video img { width: 100%; height: 100%; object-fit: cover; }

    /* Inbox */
    .chat-item {
      display: flex; align-items: center; gap: 14px; padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,
