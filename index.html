<title>Kenya Tik</title>

<style>
/* Layout concept: a phone-width column app (feed, discover, inbox, profile) with animated Kenyan scenes standing in for video; flag red is the one signal colour. */
:root{
  --bg:#0a0f0b;--surface:#131b15;--raise:#1d281f;--fg:#f2efe8;--muted:#9aa89d;--line:rgba(255,255,255,.14);
  --red:#e8372f;--on-red:#ffffff;--green:#25a85f;--sun:#f6b930;
  --stage:#0b0b0b;--media-fg:#ffffff;--scrim:rgba(0,0,0,.55);--dim:rgba(0,0,0,.55);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eff4ee;--surface:#ffffff;--raise:#e3ebe4;--fg:#0e1610;--muted:#556559;--line:rgba(14,22,16,.16);
  --red:#cc2822;--green:#177a43;--dim:rgba(14,22,16,.45);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eff4ee;--surface:#ffffff;--raise:#e3ebe4;--fg:#0e1610;--muted:#556559;--line:rgba(14,22,16,.16);
  --red:#cc2822;--green:#177a43;--dim:rgba(14,22,16,.45);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.sm{font-size:13px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;border-inline:1px solid var(--line)}
main{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
#v-home{overflow:hidden;background:var(--stage)}
.pad{padding-inline:var(--gl) var(--gr)}

/* nav */
#nav{display:flex;align-items:center;justify-content:space-around;gap:4px;padding:6px var(--gr) 6px var(--gl);background:var(--bg);border-top:1px solid var(--line)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 0;min-width:0}
#nav button[aria-current=page]{color:var(--fg)}
#nav .mk{flex:none;width:52px;height:34px;border-radius:10px;background:var(--red);color:var(--on-red);display:grid;place-items:center;padding:0}

/* home top bar */
.topbar{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px var(--gr) 26px var(--gl);background:linear-gradient(var(--scrim),transparent);color:var(--media-fg)}
.live-pill{display:flex;align-items:center;gap:6px;background:var(--red);color:var(--on-red);font-weight:600;font-size:12px;letter-spacing:.06em;padding:6px 10px;border-radius:999px;flex:none}
.live-pill i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
.tabs{flex:1;min-width:0;display:flex;justify-content:safe center;gap:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{font-weight:600;font-size:15px;opacity:.65;white-space:nowrap;padding:6px 0;border-bottom:2px solid transparent;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tabs button[aria-selected=true]{opacity:1;border-color:currentColor}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;flex:none}

/* feed */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--stage);color:var(--media-fg)}
.stage{position:absolute;inset:0;cursor:pointer}
.scene,.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.scene svg{width:100%;height:100%;display:block}
.split{position:absolute;inset:0;display:grid}
.split .scene,.split .vid{position:relative}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.7));pointer-events:none}
.tov{position:absolute;left:50%;top:38%;transform:translateX(-50%);max-width:80%;text-align:center;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;overflow-wrap:anywhere}
.cc{position:absolute;left:var(--gl);right:84px;bottom:150px;text-align:center;pointer-events:none}
.cc span{background:rgba(0,0,0,.6);padding:3px 8px;border-radius:6px;font-size:14px;font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.meta{position:absolute;left:var(--gl);right:84px;bottom:16px;display:flex;flex-direction:column;gap:6px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.who{display:flex;align-items:center;gap:6px;font-weight:600;font-size:16px}
.vf{width:16px;height:16px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
.vf .i{width:11px;height:11px;stroke:#fff;stroke-width:3}
.cap{font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cap button{font-weight:600}
.rf{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(0,0,0,.5);padding:3px 9px;border-radius:999px;align-self:flex-start}
.snd{display:flex;align-items:center;gap:8px;font-size:13px}
.snd .i{width:16px;height:16px}
.mq{overflow:hidden;white-space:nowrap;flex:1;min-width:0}
.mq span{display:inline-block;padding-left:100%;animation:mq 12s linear infinite}
.rail{position:absolute;right:var(--gr);bottom:20px;display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--media-fg)}
.rb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.7);min-width:44px}
.rb .i{width:32px;height:32px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.rb.on[data-act=like] .i{fill:var(--red);stroke:var(--red)}
.rb.on[data-act=save] .i{fill:var(--sun);stroke:var(--sun)}
.avw{position:relative;margin-bottom:10px}
.avt{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800}
.av{width:46px;height:46px;border-radius:50%;border:2px solid #fff;display:block;overflow:hidden}
.plus{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--red);color:var(--on-red);display:grid;place-items:center}
.plus .i{width:14px;height:14px;stroke-width:3}
.disc{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--red),var(--sun),var(--green),var(--red));display:grid;place-items:center;animation:spin 5s linear infinite;border:6px solid #111}
.disc i{width:8px;height:8px;border-radius:50%;background:#111;display:block}
.paused .disc{animation-play-state:paused}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.22)}
.prog i{display:block;height:100%;width:0;background:#fff}
.active:not(.paused) .prog i.auto{animation:prog 14s linear infinite}
.pbig{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .15s}
.pbig .i{width:36px;height:36px;fill:#fff;stroke:#fff}
.paused .pbig{opacity:1}
.heart{position:absolute;pointer-events:none;width:84px;height:84px;margin:-42px 0 0 -42px;color:var(--red);animation:burst .8s ease-out forwards}
.heart .i{width:84px;height:84px;fill:var(--red);stroke:var(--red)}
.empty{height:100%;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px var(--gr) 24px var(--gl);color:var(--media-fg)}

/* generic */
.btn{padding:11px 18px;border-radius:12px;background:var(--red);color:var(--on-red);font-weight:600;text-align:center}
.btn.ghost{background:var(--raise);color:var(--fg)}
.btn.sm{padding:6px 14px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:13px;white-space:nowrap;flex:none}
.chip[aria-pressed=true],.chip[aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.vh{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.01em}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px var(--gr) 8px var(--gl)}
.sec{padding:14px var(--gr) 4px var(--gl);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h3{font-size:17px}
.search{padding:4px var(--gr) 8px var(--gl);position:relative}
.search input{padding-left:40px;border-radius:999px}
.search .i{position:absolute;left:calc(var(--gl) + 12px);top:50%;margin-top:-14px;width:20px;height:20px;color:var(--muted)}
.hpad{padding:6px var(--gr) 6px var(--gl)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:3px;padding-inline:var(--gl) var(--gr)}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--stage);display:block;width:100%}
.tile svg *{animation:none!important}
.tile b{position:absolute;left:6px;bottom:5px;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);display:flex;align-items:center;gap:3px}
.tile b .i{width:13px;height:13px}
.tile em{position:absolute;right:6px;top:6px;font-style:normal;font-size:11px;font-weight:600;background:var(--red);color:var(--on-red);padding:2px 6px;border-radius:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px var(--gr) 10px var(--gl);width:100%}
.li .avt{width:100%;height:100%}
.li .ava{width:44px;height:44px;flex:none;border-radius:50%;overflow:hidden}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tx span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px var(--gr) 6px var(--gl)}
.lcard{position:relative;flex:none;width:132px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--stage);color:#fff}
.lcard svg *{animation:none!important}
.lcard .shade{background:linear-gradient(transparent 40%,rgba(0,0,0,.75))}
.lcard .lt{position:absolute;left:8px;right:8px;bottom:8px;font-size:12px;line-height:1.25;display:flex;flex-direction:column;gap:2px}
.lcard .lt b{font-size:13px}
.badge{position:absolute;left:8px;top:8px;background:var(--red);color:var(--on-red);font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:6px}
.acc{flex:none;width:112px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.acc .ava{width:52px;height:52px;border-radius:50%;overflow:hidden}
.acc b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shopcard{margin:6px var(--gr) 0 var(--gl);display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:calc(100% - var(--gl) - var(--gr))}
.shopcard .ic{width:44px;height:44px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}

/* profile */
.ph{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px var(--gr) 10px var(--gl);text-align:center}
.ph .ava{width:92px;height:92px;border-radius:50%;overflow:hidden;font-size:34px}
.ph h2{font-size:22px}
.stats{display:flex;gap:26px;justify-content:center}
.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font-family:var(--f-display);font-size:19px}
.stats span{font-size:12px;color:var(--muted)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ptabs{display:flex;border-bottom:1px solid var(--line);margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-inline:var(--gl) var(--gr)}
.ptabs button{flex:1;padding:11px 8px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;text-align:center}
.ptabs button[aria-selected=true]{color:var(--fg);border-color:var(--fg)}
.dr{display:flex;align-items:center;gap:12px;padding:10px var(--gr) 10px var(--gl)}
.dr .tile{width:60px;flex:none}
.dr .tx{flex:1;min-width:0}
.dr .tx b,.dr .tx span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* layers */
#layer{position:absolute;inset:0;pointer-events:none;z-index:50}
.sheet-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;pointer-events:auto;opacity:0;transition:opacity .2s}
.sheet-wrap.in{opacity:1}
.sheet-bg{position:absolute;inset:0;background:var(--dim)}
.sheet{position:relative;width:100%;max-height:86%;display:flex;flex-direction:column;background:var(--surface);color:var(--fg);border-radius:18px 18px 0 0;transform:translateY(24px);transition:transform .22s;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.sheet.tall{height:72%}
.in .sheet{transform:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px var(--gr) 8px var(--gl)}
.sh-h h2{font-size:18px}
.x{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--raise);flex:none}
.sh-b{overflow-y:auto;padding:4px var(--gr) 18px var(--gl);display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.full{position:absolute;inset:0;background:var(--bg);color:var(--fg);pointer-events:auto;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s}
.full.in{transform:none}
.fh{display:flex;align-items:center;gap:8px;padding:8px var(--gr) 8px calc(var(--gl) - 8px);border-bottom:1px solid var(--line)}
.fh h2{flex:1;min-width:0;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb{flex:1;min-height:0;overflow-y:auto;padding:12px var(--gr) 20px var(--gl);display:flex;flex-direction:column;gap:14px}
.fb.flush{padding:0}
.viewer{background:var(--stage)}
.vback{position:absolute;z-index:6;left:calc(var(--gl) - 6px);top:10px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row label,.row .lb{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:12px}
.row select,.row input[type=text]{width:140px}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--raise);border:1px solid var(--line);position:relative;padding:0;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw:checked{background:var(--green);border-color:var(--green)}
.sw:checked::after{transform:translateX(18px);background:#fff}
.fl-label{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.cr-prev{position:relative;aspect-ratio:9/14;max-height:300px;margin:0 auto;width:min(100%,196px);border-radius:14px;overflow:hidden;background:var(--stage);color:#fff;display:grid;place-items:center}
.cr-prev .tov{font-size:18px}
.cr-prev .ph-t{position:relative;padding:12px;text-align:center;font-size:13px;color:#cfd8d1;z-index:1}
.cr-prev .rf{position:absolute;left:6px;bottom:6px;font-size:11px;z-index:2}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick input[type=file]{display:none}
.sceneopt{width:46px;height:62px;border-radius:8px;overflow:hidden;border:2px solid transparent;flex:none;position:relative;padding:0}
.sceneopt[aria-pressed=true]{border-color:var(--sun)}
.sceneopt .scene{position:absolute;inset:0}
.sceneopt svg *{animation:none!important}
.cm-list{display:flex;flex-direction:column;gap:14px}
.cm{display:flex;gap:10px;align-items:flex-start}
.cm .ava{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;font-size:14px}
.cm .tx{flex:1;min-width:0}
.cm .tx b{font-size:13px;color:var(--muted)}
.cm .tx p{font-size:14px;overflow-wrap:anywhere}
.cm .tx .mt{font-size:12px;color:var(--muted);display:flex;gap:12px}
.cm .lk{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);flex:none}
.cm .lk .i{width:18px;height:18px}
.cm .lk.on{color:var(--red)}

.men{color:var(--sun);font-weight:600}
.cm-form{display:flex;gap:8px;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{font-size:20px;padding:2px 6px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sg button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center;padding:10px 4px;border-radius:12px;background:var(--raise);min-width:0}
.sg button[disabled]{opacity:.4}

.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 12px;border-radius:16px;background:var(--raise);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--red);color:var(--on-red)}
.chatf{display:flex;gap:8px;padding:10px var(--gr) 10px var(--gl);border-top:1px solid var(--line)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;gap:4px}
.bar .tr{height:10px;border-radius:99px;background:var(--raise);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--green);border-radius:99px}

.sum b{font-family:var(--f-display);font-size:22px;display:block}
.prod{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.prod .sw2{width:56px;height:56px;border-radius:12px;flex:none}
.prod .tx{flex:1;min-width:0}
.prod .tx b,.prod .tx span{display:block}

/* live room */
.room{background:var(--stage);color:#fff}

/* ---------- procedural beat (stand-in for licensed music) ---------- */
let AC=null,beatT=null;
function blip(f,d,type,g){const o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(g,AC.currentTime);a.gain.exponentialRampToValueAtTime(.0008,AC.currentTime+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function beatStop(){clearInterval(beatT);beatT=null}
function beatStart(s){
 beatStop();if(!s||!s.bpm||!S.set.sound)return;
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return}
 const pat=[0,3,5,3,7,5,3,0],ms=60000/s.bpm/2;let i=0;
 beatT=setInterval(()=>{try{if(i%4===0)blip(55,.18,'sine',.5);if(i%2===1)blip(s.root*Math.pow(2,pat[(i>>1)%8]/12),.25,'triangle',.08)}catch(e){}i++},ms);
}
function syncBeat(){
 const act=$$('.post.active').filter(el=>!el.classList.contains('paused')&&el.offsetParent!==null).pop();

}

  const tags=(C.cap.match(/#[\p{L}\d_]+/gu)||[]).map(x=>x.slice(1));
  const p=mk({id:'u'+Date.now(),user:S.me.handle,cat:C.cat,scene:C.scene===null?0:C.scene,media:C.hasMedia?{url:C.url,type:C.type}:null,sound:C.sound,cap:C.cap.replace(/#[\p{L}\d_]+/gu,'').trim(),tags:tags,likes:0,cc:0,sv:0,sh:0,text:C.text,filter:C.filter,speed:C.speed,allowC:C.allowC,allowD:C.allowD,allowS:C.allowS,vis:C.vis,ref:C.ref,friend:true});
  if(opts.draftIndex!==undefined)S.drafts.splice(opts.draftIndex,1);
  if(C.sched&&new Date(C.sched).getTime()>Date.now()){p.when=new Date(C.sched).getTime();S.scheduled.push(p);closeEl(el);toast('Scheduled for '+new Date(C.sched).toLocaleString());if(S.view==='profile')renderProfile();return}
  S.posts.unshift(p);closeEl(el);S.tab='foryou';renderTop();go('home');toast(p.vis==='me'?'Saved. Only you can see it.':'Posted');
 });
  }
   }
  /* ---------- settings, profile edit, analytics, shop, wallet ---------- */
function toggleRow(k,label,sub){return `<div class="row"><label for="st-${k}">${label}${sub?`<small>${sub}</small>`:''}</label><input class="sw" type="checkbox" id="st-${k}" data-set="${k}" ${S.set[k]?'checked':''}></div>`}
function openSettings(){
 const el=openSheet(t('settings'),`
  <div class="row"><label for="st-lang">Language</label><select id="st-lang" data-set="lang"><option value="en" ${S.set.lang==='en'?'selected':''}>English</option><option value="sw" ${S.set.lang==='sw'?'selected':''}>Kiswahili</option></select></div>
  <div class="row"><label for="st-theme">Theme</label><select id="st-theme" data-set="theme"><option value="system" ${S.set.theme==='system'?'selected':''}>System</option><option value="light" ${S.set.theme==='light'?'selected':''}>Light</option><option value="dark" ${S.set.theme==='dark'?'selected':''}>Dark</option></select></div>
  ${toggleRow('priv','Private account','Only people you approve can follow you')}
  ${toggleRow('restricted','Restricted mode','Hides LIVE rooms flagged for older audiences')}
  ${toggleRow('captions','Auto-captions','Show a caption line on videos')}
  ${toggleRow('saver','Data saver','Turns off scene animation')}
  ${toggleRow('sound','Sound','Plays a generated beat for each sound')}
  ${toggleRow('family','Family Pairing (demo)','Marks this account as linked to a parent. No controls are enforced here.')}
  <div class="row"><label for="st-limit">Daily screen time reminder</label><select id="st-limit" data-set="limit"><option value="0" ${!+S.set.limit?'selected':''}>Off</option><option value="1" ${+S.set.limit===1?'selected':''}>After 1 min (test)</option><option value="30" ${+S.set.limit===30?'selected':''}>After 30 min</option><option value="60" ${+S.set.limit===60?'selected':''}>After 60 min</option><option value="120" ${+S.set.limit===120?'selected':''}>After 2 hours</option></select></div>
  <div><label class="fl-label" for="st-filters">Comment filter words (comma separated)</label><input id="st-filters" data-set="filters" type="text" style="width:100%" value="${esc(S.set.filters)}" placeholder="spam, scam"></div>
  <div><span class="fl-label">Blocked accounts</span>${S.blocked.size?[...S.blocked].map(h=>`<div class="row"><span>@${esc(h)}</span><button class="btn ghost sm" data-unblock="${esc(h)}">Unblock</button></div>`).join(''):'<p class="muted sm">None</p>'}</div>
  <button class="btn ghost" data-reset>Reset demo data</button>`);
 el.addEventListener('click',e=>{
  const u=e.target.closest('[data-unblock]');if(u){S.blocked.delete(u.dataset.unblock);persist();closeEl(el);openSettings();renderFeed()}
  if(e.target.closest('[data-reset]')){try{localStorage.removeItem(KEY)}catch(x){}location.reload()}
 });
}
document.addEventListener('input',e=>{
 const k=e.target.dataset&&e.target.dataset.set;if(!k)return;
 const v=e.target.type==='checkbox'?e.target.checked:e.target.value;S.set[k]=v;persist();
 if(k==='lang'){renderAll();const sh=$('.sheet-wrap');if(sh){closeEl(sh);openSettings()}}
 if(k==='theme')applyTheme();
 if(k==='saver')$('#app').classList.toggle('saver',!!v);
 if(k==='captions')renderFeed();
 if(k==='sound'){renderTop();syncBeat();document.querySelectorAll('video').forEach(x=>x.muted=!v)}
 if(k==='restricted'&&S.view==='discover')renderDiscover();
 if(k==='limit')t0=Date.now();
 if(k==='priv'&&S.view==='profile')renderProfile();
});
function applyTheme(){const r=document.documentElement;if(S.set.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.set.theme)}
function openEdit(){
 const el=openSheet(t('edit'),`<div><label class="fl-label" for="ep-n">Name</label><input id="ep-n" maxlength="30" value="${esc(S.me.name)}"></div><div><label class="fl-label" for="ep-h">Username</label><input id="ep-h" maxlength="24" value="${esc(S.me.handle)}"></div><div><label class="fl-label" for="ep-b">Bio</label><textarea id="ep-b" maxlength="120">${esc(S.me.bio)}</textarea></div><button class="btn" id="ep-s">Save</button>`);
 $('#ep-s',el).addEventListener('click',()=>{
  const h=$('#ep-h',el).value.trim().toLowerCase().replace(/[^a-z0-9._]/g,'');
  if(!h){toast('Use letters, numbers, dots or underscores');return}
  if(USERS.some(u=>u.h===h)){toast('That username is taken');return}
  const old=S.me.handle;S.posts.forEach(p=>{if(p.user===old)p.user=h});
  S.me.name=$('#ep-n',el).value.trim()||'Your Name';S.me.handle=h;S.me.bio=$('#ep-b',el).value.trim();persist();closeEl(el);renderProfile();toast('Profile updated');
 });
}
function openAnalytics(){
 const mine=S.posts.filter(p=>p.user===S.me.handle);
 const tot=k=>mine.reduce((a,p)=>a+(k==='likes'?p.likes+(S.liked.has(p.id)?1:0):p[k]),0);
 const max=Math.max(1,...mine.map(p=>p.views));
 openSheet('Analytics',mine.length?`<p class="muted sm">Counts from this device only.</p><div class="sum"><div><b>${fmt(tot('views'))}</b><span class="muted sm">Video views</span></div><div><b>${fmt(tot('likes'))}</b><span class="muted sm">Likes</span></div><div><b>${fmt(tot('cc'))}</b><span class="muted sm">Comments</span></div><div><b>${fmt(tot('sh'))}</b><span class="muted sm">Shares</span></div></div><div class="bars">${mine.map(p=>`<div class="bar"><span class="sm">${esc((p.cap||'Video').slice(0,40))} · ${p.views} views</span><div class="tr"><i style="width:${Math.round(p.views/max*100)}%"></i></div></div>`).join('')}</div>`:'<p class="muted">Post a video to see analytics here.</p>');
}
function openShop(){
 const total=()=>PRODUCTS.reduce((a,p)=>a+(S.cart[p.id]||0)*p.p,0),count=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
 const el=openSheet(t('shop'),`<div id="shl"></div>`);
 const draw=()=>{$('#shl',el).innerHTML=PRODUCTS.map(p=>`<div class="prod"><span class="sw2" style="background:${p.c}"></span><span class="tx"><b>${esc(p.n)}</b><span class="muted">KSh ${p.p.toLocaleString()}</span></span>${S.cart[p.id]?`<span style="display:flex;align-items:center;gap:8px"><button class="x" data-m="${p.id}" aria-label="Remove one">${ico('minus')}</button><b>${S.cart[p.id]}</b><button class="x" data-a="${p.id}" aria-label="Add one">${ico('plus')}</button></span>`:`<button class="btn sm" data-a="${p.id}">Add</button>`}</div>`).join('')+`<div class="row" style="border:0"><b>Total (${count()} item${count()===1?'':'s'})</b><b>KSh ${total().toLocaleString()}</b></div><button class="btn" data-order ${count()?'':'disabled'}>Place order (demo)</button><p class="muted sm">Demo only. No payment is taken and nothing is shipped.</p>`};
 draw();
 el.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]'),m=e.target.closest('[data-m]');
  if(a){S.cart[a.dataset.a]=(S.cart[a.dataset.a]||0)+1;draw()}
  if(m){const k=m.dataset.m;S.cart[k]=Math.max(0,(S.cart[k]||0)-1);if(!S.cart[k])delete S.cart[k];draw()}
  if(e.target.closest('[data-order]')&&count()){S.cart={};closeEl(el);toast('Demo order placed. No payment taken.')}
 });
}
function openWallet(){
 const el=openSheet(t('coins'),`<p>You have <b id="wc">${S.coins}</b> coins. Coins are used to send gifts in LIVE rooms.</p><button class="btn" data-top>Add 100 coins (demo)</button><p class="muted sm">Demo coins only. No real payment is taken.</p>`);
 el.addEventListener('click',e=>{if(e.target.closest('[data-top]')){S.coins+=100;persist();$('#wc',el).textContent=S.coins;if(S.view==='profile')renderProfile()}});
}

/* ---------- navigation ---------- */
function renderNav(){
 const items=[['home','home'],['discover','search'],['create','plus'],['inbox','inbox'],['me','user']];
 $('#nav').innerHTML=items.map(([k,i])=>k==='create'?`<button data-act="create" aria-label="${t('create')}"><span class="mk">${ico('plus')}</span></button>`:`<button data-act="nav" data-v="${k==='me'?'profile':k}" aria-current="${S.view===(k==='me'?'profile':k)?'page':'false'}">${ico(i)}<span>${t(k)}</span></button>`).join('');
}
function go(v){
 S.view=v;
 ['home','discover','inbox','profile'].forEach(k=>{$('#v-'+k).hidden=k!==v});
 if(v==='home'){renderTop();if(!$('#feed .post'))renderFeed()}
 else beatStop();
 if(v==='discover')renderDiscover();
 if(v==='inbox')renderInbox();
 if(v==='profile')renderProfile();
 renderNav();
 if(v==='home')setTimeout(syncBeat,200);
}
function renderAll(){renderTop();renderNav();renderFeed();if(S.view==='discover')renderDiscover();if(S.view==='inbox')renderInbox();if(S.view==='profile')renderProfile()}

/* ---------- click router ---------- */
const A={
 tab(b){S.tab=b.dataset.v;renderTop();renderFeed()},
 nav(b){closeAll();go(b.dataset.v)},
 create(){openCreate()},
 like(b){toggleLike(b.dataset.id)},
 save(b){toggleSave(b.dataset.id)},
 follow(b){toggleFollow(b.dataset.u)},
 comments(b){openComments(b.dataset.id)},
 share(b){openShare(b.dataset.id)},
 profile(b){openUser(b.dataset.u)},
 tag(b){searchFor('#'+b.dataset.tag)},
 close(b){closeEl(b.closest('.sheet-wrap,.full'))},
 cat(b){S.cat=b.dataset.v;drawDisc()},
 open(b){openViewer(b.dataset.ids.split(','),b.dataset.id)},
 live(){openLive()},
 room(b){openRoom(b.dataset.id)},
 golive(){toast('Going LIVE needs camera access, which this prototype does not have.')},
 sound(){S.set.sound=!S.set.sound;persist();renderTop();document.querySelectorAll('video').forEach(x=>x.muted=!S.set.sound);syncBeat();toast(S.set.sound?'Sound on':'Sound off')},
 settings(){openSettings()},
 editprofile(){openEdit()},
 analytics(){openAnalytics()},
 shop(){openShop()},
 wallet(){openWallet()},
 ptab(b){S.ptab=b.dataset.v;renderProfile()},
 itab(b){S.itab=b.dataset.v;renderInbox()},
 dm(b){openThread(b.dataset.u)},
 editdraft(b){const i=+b.dataset.i;openCreate({draft:S.drafts[i],draftIndex:i})},
 deldraft(b){S.drafts.splice(+b.dataset.i,1);renderProfile()},
 blockuser(b){S.blocked.add(b.dataset.u);persist();closeAll();renderFeed();if(S.view==='discover')renderDiscover();toast('Blocked @'+b.dataset.u)}
};
  document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(b&&A[b.dataset.act]){e.stopPropagation();A[b.dataset.act](b,e)}
});

/* ---------- timers ---------- */
let t0=Date.now();
setInterval(()=>{
 const L=+S.set.limit;
 if(L&&(Date.now()-t0)/60000>=L){t0=Date.now();const el=openSheet('Time for a break',`<p>You have been on Kenya Tik for ${L} minute${L===1?'':'s'}. Maybe stretch, drink some water, or call a friend.</p><button class="btn" data-act="close">Keep watching</button>`)}
 const now=Date.now(),due=S.scheduled.filter(p=>p.when<=now);
 if(due.length){S.scheduled=S.scheduled.filter(p=>p.when>now);due.forEach(p=>{p.friend=true;S.posts.unshift(p)});toast('Your scheduled video is live');renderFeed();if(S.view==='profile')renderProfile()}
},20000);

/* ---------- boot ---------- */
applyTheme();
$('#app').classList.toggle('saver',!!S.set.saver);
renderTop();renderNav();renderFeed();go('home');
const m=location.hash.match(/^#v-(\w+)$/);
if(m&&P(m[1]))setTimeout(()=>openViewer([m[1]],m[1]),100);
})();
</script>
