
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KenyaTik</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 16px;
      background: #181818;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      color: #ff3155;
    }

    main {
      max-width: 480px;
      margin: auto;
      padding: 20px 16px 90px;
    }

    .welcome {
      padding: 20px;
      background: #202020;
      border-radius: 14px;
      text-align: center;
    }

    .welcome h2 {
      margin-top: 0;
    }

    .status {
      margin-top: 18px;
      color: #aaa;
      font-size: 14px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      padding: 14px 4px;
      background: #181818;
      border-top: 1px solid #333;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 13px;
    }

    nav a:focus,
    nav a:hover {
      color: #ff3155;
    }
  </style>
</head>
<body>
  <header>
    <h1>KenyaTik 🇰🇪</h1>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome to KenyaTik</h2>
      <p>Your home for short videos from Kenya.</p>
      <p>We are rebuilding the video feed.</p>
    </section>

    <p class="status" id="status">
      KenyaTik is running.
    </p>
  </main>

  <nav>
    <a href="#home">Home</a>
    <a href="#discover">Discover</a>
    <a href="#create">Create</a>
    <a href="#inbox">Inbox</a>
    <a href="#profile">Profile</a>
  </nav>

  <script>
    "use strict";

    document.addEventListener("DOMContentLoaded", function () {
      const status = document.getElementById("status");

      if (status) {
        status.textContent = "KenyaTik is running successfully.";
      }
    });
  </script>
</body>
</html>
